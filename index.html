<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محلل البلاغات الاحترافي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a40;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #e8e8f0;
    --text-muted: #7070a0;
    --danger: #ff4757;
    --warn: #ffa502;
    --success: #2ed573;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 20%, rgba(108,99,255,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 80% 80%, rgba(255,101,132,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 20px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  .logo-ring {
    width: 75px;
    height: 75px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    box-shadow: 0 0 40px rgba(108,99,255,0.4);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(108,99,255,0.4); }
    50% { box-shadow: 0 0 60px rgba(108,99,255,0.7), 0 0 80px rgba(255,101,132,0.3); }
  }

  h1 {
    font-family: 'Tajawal', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .search-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .input-wrap {
    position: relative;
    width: 100%;
  }

  .input-wrap span {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 1.2rem;
  }

  input[type="text"] {
    width: 100%;
    padding: 18px 50px 18px 20px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 1.1rem;
    outline: none;
    direction: ltr;
    text-align: left;
    transition: 0.3s;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(108,99,255,0.15);
  }

  .btn-analyze {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border: none;
    border-radius: 14px;
    color: white;
    font-family: 'Cairo', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(108,99,255,0.4);
    transition: 0.3s;
  }

  .btn-analyze:hover {
    opacity: 0.9;
    transform: translateY(-2px);
  }

  .loading {
    display: none;
    text-align: center;
    padding: 48px;
  }

  .loading.show { display: block; }

  .spinner {
    width: 56px;
    height: 56px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-steps {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 16px;
    text-align: right;
    max-width: 280px;
    margin: 16px auto 0;
  }

  .loading-step {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    color: var(--text-muted);
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--surface2);
    opacity: 0.4;
  }

  .loading-step.active { opacity: 1; color: var(--accent); }
  .loading-step.done { opacity: 1; color: var(--success); }

  #results { display: none; }
  #results.show { display: block; }

  .profile-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .profile-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--border);
  }

  .profile-info h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
  .profile-info p { font-size: 0.85rem; color: var(--text-muted); }

  .violation-badge {
    margin-right: auto;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 700;
    background: rgba(255,71,87,0.15);
    color: var(--danger);
    border: 1px solid rgba(255,71,87,0.3);
  }

  .section-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .violations-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .violation-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .violation-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 4px;
    height: 100%;
  }
  .v-spam::before { background: #f59e0b; }
  .v-violence::before { background: var(--danger); }
  .v-adult::before { background: var(--accent2); }

  .v-icon { font-size: 1.8rem; margin-bottom: 10px; }
  .v-title { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
  .v-reason { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }
  .v-count { 
    display: inline-block;
    padding: 4px 10px;
    background: var(--surface2);
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--warn);
    border: 1px solid var(--border);
  }

  .report-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 24px;
  }

  .report-box h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }

  .report-step {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    background: var(--surface2);
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
  }

  .step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: white;
  }
  .step-text { font-size: 0.9rem; line-height: 1.6; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-ring">🔍</div>
    <h1>محلل البلاغات</h1>
    <p class="subtitle">أدخل يوزر الحساب لتحليل الثغرات واستخراج تقرير البلاغات</p>
  </header>

  <div class="search-card">
    <div class="input-group">
      <div class="input-wrap">
        <span>@</span>
        <input type="text" id="usernameInput" placeholder="أدخل اليوزر هنا..." autocomplete="off" />
      </div>
      <button class="btn-analyze" onclick="analyzeAccount()">تحليل الحساب</button>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="color: var(--text-muted);">جاري فحص الحساب واستخراج الثغرات...</p>
    <div class="loading-steps">
      <div class="loading-step" id="step1">🔎 قراءة أحرف ومعرف الحساب</div>
      <div class="loading-step" id="step2">🖼️ فحص الأفاتار والواجهة</div>
      <div class="loading-step" id="step3">📝 تحليل سجل النشاط والثغرات</div>
      <div class="loading-step" id="step4">⚡ تفعيل حزمة البلاغات الثقيلة</div>
    </div>
  </div>

  <div id="results">
    <div class="profile-card" id="profileCard"></div>
    <p class="section-title">بنود البلاغات المستخرجة خصيصاً لهذا الحساب</p>
    <div class="violations-grid" id="violationsGrid"></div>
    <div class="report-box" id="reportBox"></div>
  </div>
</div>

<script>
function generateViolationsByUsername(username) {
  let charSum = 0;
  let multiplier = 1;
  for (let i = 0; i < username.length; i++) {
    let code = username.charCodeAt(i);
    charSum += code * multiplier;
    multiplier = (multiplier + i) % 10 + 1;
  }

  let seed = charSum;
  const pseudoRandom = () => {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  };

  const getRange = (min, max) => {
    return Math.floor(pseudoRandom() * (max - min + 1)) + min;
  };

  // البلاغات الأساسية القوية المطلوبة دائماً في البداية
  const coreViolations = [
    { title: 'سبام / Spam', icon: '⚡', reason: 'رصد رسائل مزعجة وإرسال محتوى متكرر بكميات كبيرة', cssClass: 'v-spam', count: () => getRange(10, 30) },
    { title: 'احتيال / سكام (الأول)', icon: '⚠️', reason: 'رصد روابط خبيثة ومحاولات استدراج ونصب للمستخدمين', cssClass: 'v-spam', count: () => getRange(7, 12) },
    { title: 'احتيال / سكام (الثاني)', icon: '💸', reason: 'استخدام الحساب لعمليات تحويل وهمية وغسيل أموال', cssClass: 'v-spam', count: () => getRange(7, 12) },
    { title: 'احتيال / سكام (الرابع)', icon: '🛡️', reason: 'ترويج خدمات وهمية ومسابقات كاذبة لاستنزاف الضحايا', cssClass: 'v-spam', count: () => getRange(7, 12) },
    { title: 'عنف وتحريض (الأول)', icon: '⚔️', reason: 'نشر عبارات تحمل تهديداً مباشراً وتحريضاً ضد الأفراد', cssClass: 'v-violence', count: () => getRange(5, 12) },
    { title: 'عنف وتحريض (الخامس)', icon: '🚨', reason: 'محتوى مرئي أو كتابي يعبر عن العنف الشديد والتخريب', cssClass: 'v-violence', count: () => getRange(5, 12) }
  ];

  // البلاغات الإضافية المتنوعة لتكملة التشكيلة بناءً على اليوزر
  const optionalViolations = [
    { title: 'هيت / Hate (الكراهية)', icon: '🔥', reason: 'نشر محتوى تحريضي يثير الكراهية والعنف', cssClass: 'v-violence', count: () => getRange(5, 12) },
    { title: 'سيلف / إيذاء النفس', icon: '⚠️', reason: 'ترويج أو تشجيع على أساليب إيذاء النفس', cssClass: 'v-violence', count: () => getRange(7, 10) },
    { title: 'محتوى إباحي', icon: '🔞', reason: 'مخالفة معايير الأمان العامة ونشر وسائط غير لائقة', cssClass: 'v-adult', count: () => getRange(5, 7) },
    { title: 'مخدرات', icon: '💊', reason: 'الترويج لتعاطي أو ترويج مواد ممنوعة ومخدرة', cssClass: 'v-violence', count: () => getRange(3, 7) },
    { title: 'خداع / زائف', icon: '🛡️', reason: 'وجود معلومات مضللة وحسابات وهمية', cssClass: 'v-spam', count: () => getRange(3, 6) },
    { title: 'مضايقة / Harassment', icon: '🚨', reason: 'مضايقة متكررة واعتداء لفظي على الآخرين', cssClass: 'v-violence', count: () => getRange(3, 5) }
  ];

  // اختيار السبام أولاً بشكل دائم
  let selected = [coreViolations[0]]; // دائماً يبدأ بالسبام

  // اختيار عشوائي ذكي لبعض البلاغات القوية المحددة (مثل سكام وعنف)
  let strongPool = coreViolations.slice(1);
  strongPool.sort(() => pseudoRandom() - 0.5);

  // تحديد عدد البلاغات الكلي لكل حساب (مثلاً بين 4 إلى 6 بلاغات مختلفة)
  let totalCount = 4 + Math.floor(pseudoRandom() * 3); // يعطي 4 أو 5 أو 6
  
  // دمج البلاغات القوية والإضافية بشكل عشوائي فريد لكل يوزر
  let mixedExtras = [...strongPool, ...optionalViolations];
  mixedExtras.sort(() => pseudoRandom() - 0.5);

  // إكمال العدد المطلوب
  for (let i = 0; i < totalCount - 1 && i < mixedExtras.length; i++) {
    selected.push(mixedExtras[i]);
  }

  return selected.map(v => ({
    ...v,
    requiredCount: v.count()
  }));
}

function analyzeAccount() {
  const username = document.getElementById('usernameInput').value.trim();
  if (!username) {
    alert('الرجاء إدخال اليوزر أولاً');
    return;
  }

  document.getElementById('loading').classList.add('show');
  document.getElementById('results').classList.remove('show');

  document.getElementById('step1').innerText = `🔎 قراءة الأحرف والخصائص (${username})`;

  setTimeout(() => document.getElementById('step1').classList.add('active'), 300);
  setTimeout(() => { 
    document.getElementById('step1').classList.replace('active', 'done'); 
    document.getElementById('step2').classList.add('active'); 
  }, 800);
  setTimeout(() => { 
    document.getElementById('step2').classList.replace('active', 'done'); 
    document.getElementById('step3').classList.add('active'); 
  }, 1300);
  setTimeout(() => { 
    document.getElementById('step3').classList.replace('active', 'done'); 
    document.getElementById('step4').classList.add('active'); 
  }, 1700);

  setTimeout(() => {
    document.getElementById('loading').classList.remove('show');
    ['step1', 'step2', 'step3', 'step4'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.classList.remove('active', 'done');
    });

    const violations = generateViolationsByUsername(username);
    
    document.getElementById('profileCard').innerHTML = `
      <img class="profile-avatar" src="https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=1a1a26&color=6c63ff&size=72" />
      <div class="profile-info">
        <h3>@${username}</h3>
        <p>تم فحص السجل بنجاح • تم رصد ${violations.length} ثغرات رئيسية مرتبطة بالحساب</p>
      </div>
      <span class="violation-badge">🚨 خطر عالي جداً</span>
    `;

    const grid = document.getElementById('violationsGrid');
    grid.innerHTML = violations.map(v => `
      <div class="violation-card ${v.cssClass}">
        <div class="v-icon">${v.icon}</div>
        <div class="v-title">${v.title}</div>
        <div class="v-reason">${v.reason}</div>
        <div class="v-count">📌 مطلوب الإبلاغ: ${v.requiredCount} مرات</div>
      </div>
    `).join('');

    document.getElementById('reportBox').innerHTML = `
      <h3>📋 خطوات البلاغات المخصصة لإسقاط الحساب</h3>
      ${violations.map((v, i) => `
        <div class="report-step">
          <div class="step-num">${i+1}</div>
          <div class="step-text">البلاغ (${i+1}): أبلغ عن الحساب تحت بند <strong>${v.title}</strong> بمقدار <strong>${v.requiredCount} مرات</strong> متتالية.</div>
        </div>
      `).join('')}
    `;

    document.getElementById('results').classList.add('show');
  }, 2200);
}
</script>
</body>
</html>
